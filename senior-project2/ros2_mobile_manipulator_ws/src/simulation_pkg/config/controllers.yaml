# controllers.yaml
# ros2_control position controllers for the 4-DOF arm.
# Joint names MUST match assembly_of_robot.urdf exactly.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Joint State Broadcaster – publishes /joint_states for all joints
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Arm position controller
    arm_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ── Arm position controller parameters ────────────────────────────────────────
arm_position_controller:
  ros__parameters:
    joints:
      - arm1_joint
      - arm2_joint
      - arm3_joint
      - gripper_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0   # Hz
    action_monitor_rate: 20.0  # Hz

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0            # 0 = no time limit
      arm1_joint:
        trajectory: 0.05
        goal: 0.02
      arm2_joint:
        trajectory: 0.05
        goal: 0.02
      arm3_joint:
        trajectory: 0.05
        goal: 0.02
      gripper_joint:
        trajectory: 0.05
        goal: 0.02
